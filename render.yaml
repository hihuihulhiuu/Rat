services:
  - type: web
    name: nordvale-identity
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NV_PANEL_KEY
        generateValue: true
      - key: NV_SECURE_COOKIES
        value: "1"
      - key: NV_TRUST_PROXY
        value: "1"
      - key: NV_GEO
        value: "1"
      - key: NV_DB
        value: /data/nordvale.sqlite3
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
