services:
  - type: web
    name: nordvale-identity-2
    runtime: docker
    plan: free
    autoDeploy: true
    # Dockerfile and code must be at the repo root. If they live in a subfolder,
    # set rootDir to that folder (e.g. rootDir: login-portal).
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NV_PANEL_KEY
        generateValue: true
      - key: NV_SECURE_COOKIES
        value: "1"
      - key: NV_TRUST_PROXY
        value: "1"
      - key: NV_GEO
        value: "1"
      # Free tier: no persistent disk. DB lives in the container and resets on
      # every deploy/restart. For durable storage use a paid instance with a
      # disk (/data) or an external database.
      - key: NV_DB
        value: /data/nordvale.sqlite3
